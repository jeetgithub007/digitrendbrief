<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>DigitalBrief — Editorial Content Management System</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #050811;
            --bg-surface: #0a0e1a;
            --bg-card: #0f172a;
            --bg-card-hover: #152038;
            --border-color: #1e293b;
            --accent-primary: #6366f1;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-purple: #a855f7;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            line-height: 1.5;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 8, 17, 0.94);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 24px;
        }
        .header-inner {
            max-width: 1380px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.25rem;
            color: #f8fafc;
            text-decoration: none;
        }
        .brand-icon-box {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-text { letter-spacing: -0.02em; }
        .brand-text-highlight {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand-badge-tech {
            font-size: 0.68rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 5px;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #c084fc;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            border: 1px solid transparent;
            outline: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(99, 102, 241, 0.5);
        }
        .btn-secondary {
            background: #1e293b;
            color: var(--text-secondary);
            border-color: #334155;
        }
        .btn-secondary:hover {
            background: #27354f;
            color: #fff;
        }
        .btn-green {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-green:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.45);
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .btn-danger:hover {
            background: var(--accent-red);
            color: #fff;
        }

        .container {
            max-width: 1380px;
            margin: 28px auto;
            padding: 0 20px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px 22px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .stat-val {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        /* Controls */
        .controls-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        input[type="text"], select, textarea {
            background: #050811;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 9px 14px;
            color: var(--text-primary);
            font-size: 0.88rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--accent-primary);
        }

        /* Table */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow-x: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.88rem;
        }
        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background: #080c18;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.06em;
        }
        tr:hover { background: var(--bg-card-hover); }

        .badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .badge-published {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .badge-draft {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-amber);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 880px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.85);
        }
        .modal-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-body {
            padding: 22px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal-footer {
            padding: 14px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            background: #080c18;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        /* Toast Alert */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #10b981;
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.88rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            z-index: 2000;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Direct Editorial CMS Layout (Open Access, Zero Login Walls) -->
    <header>
        <div class="header-inner">
            <a href="/" class="brand-logo">
                <div class="brand-icon-box">
                    <svg width="20" height="20" viewBox="0 0 100 100" fill="none">
                        <rect x="4" y="4" width="92" height="92" rx="24" fill="#0F172A" stroke="#6366F1" stroke-width="4"/>
                        <polygon points="50,16 80,32 80,68 50,84 20,68 20,32" fill="none" stroke="#06B6D4" stroke-width="4" stroke-dasharray="8 4"/>
                        <path d="M34 32 C34 32 34 68 34 68 C34 68 52 68 52 50 C52 32 34 32 34 32 Z" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
                        <path d="M50 32 C62 32 68 40 60 48 C68 54 64 68 48 68" fill="none" stroke="#A855F7" stroke-width="5" stroke-linecap="round"/>
                        <circle cx="50" cy="50" r="5" fill="#00F2FE"/>
                    </svg>
                </div>
                <span class="brand-text">DIGITAL<span class="brand-text-highlight">BRIEF</span></span>
                <span class="brand-badge-tech"><span class="pulse-dot"></span>Editorial CMS</span>
            </a>
            <div class="nav-links">
                <a href="/" class="btn btn-secondary">🌐 Public Homepage</a>
                <a href="/dashboard" class="btn btn-primary">⚡ Trend Dashboard</a>
                <button class="btn btn-green" onclick="openCreateModal()">➕ Write New Article</button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Stats Bar -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Articles</div>
                <div class="stat-val" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Published Live</div>
                <div class="stat-val" id="stat-published" style="color:var(--accent-green)">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Drafts</div>
                <div class="stat-val" id="stat-drafts" style="color:var(--accent-amber)">0</div>
            </div>
        </div>

        <!-- Controls Bar -->
        <div class="controls-bar">
            <div class="filter-group">
                <input type="text" id="search-input" placeholder="🔍 Search articles..." style="width:260px;" oninput="loadArticles()">
                <select id="status-filter" onchange="loadArticles()">
                    <option value="">All Statuses</option>
                    <option value="published">Published</option>
                    <option value="draft">Drafts</option>
                </select>
                <select id="category-filter" onchange="loadArticles()">
                    <option value="">All Categories</option>
                    <option value="AI">AI</option>
                    <option value="Startups & Funding">Startups</option>
                    <option value="Cybersecurity">Cybersecurity</option>
                    <option value="Technology">Technology</option>
                    <option value="India News">India News</option>
                    <option value="Business & Finance">Business & Finance</option>
                    <option value="Gadgets & Hardware">Gadgets & Hardware</option>
                </select>
            </div>

            <button class="btn btn-green" onclick="openCreateModal()">➕ Write New Article</button>
        </div>

        <!-- Articles Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Article Title & Slug</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Author</th>
                        <th>Published Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="articles-tbody">
                    <tr><td colspan="6" style="text-align:center; padding:40px; color:var(--text-muted);">Loading published articles...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Editor -->
    <div class="modal-overlay" id="article-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title" style="font-size:1.15rem; font-weight:800;">Edit Article</h3>
                <button onclick="closeModal()" style="background:none; border:none; color:var(--text-muted); font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-id">
                
                <div class="form-group">
                    <label>Article Title *</label>
                    <input type="text" id="edit-title" required placeholder="e.g. Breakthrough AI Models Redefining Real-Time Search">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>URL Slug (auto-generated if left blank)</label>
                        <input type="text" id="edit-slug" placeholder="e.g. breakthrough-ai-models-search">
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="edit-category">
                            <option value="AI">AI</option>
                            <option value="Startups & Funding">Startups & Funding</option>
                            <option value="Crypto & Web3">Crypto & Web3</option>
                            <option value="Cybersecurity">Cybersecurity</option>
                            <option value="Gadgets & Hardware">Gadgets & Hardware</option>
                            <option value="Software & Dev">Software & Dev</option>
                            <option value="Business & Finance">Business & Finance</option>
                            <option value="Technology">Technology</option>
                            <option value="India News">India News</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Status</label>
                        <select id="edit-status">
                            <option value="published">Published</option>
                            <option value="draft">Draft</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Author</label>
                        <input type="text" id="edit-author" value="DigitalBrief Editorial Desk">
                    </div>
                </div>

                <div class="form-group">
                    <label>Excerpt / Summary</label>
                    <textarea id="edit-excerpt" rows="2" placeholder="Brief summary of the article..."></textarea>
                </div>

                <div class="form-group">
                    <label>Article Content (HTML supported)</label>
                    <textarea id="edit-content" rows="9" style="font-family:var(--font-mono); font-size:0.85rem;" placeholder="<p>Full article body...</p>"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>SEO Meta Title</label>
                        <input type="text" id="edit-seo-title" placeholder="Meta title for search engines">
                    </div>
                    <div class="form-group">
                        <label>Focus Keyword</label>
                        <input type="text" id="edit-focus-kw" placeholder="e.g. artificial intelligence">
                    </div>
                </div>

                <div class="form-group">
                    <label>Meta Description</label>
                    <textarea id="edit-meta-desc" rows="2" placeholder="Search snippet under 160 characters..."></textarea>
                </div>

                <div class="form-group">
                    <label>Featured Image URL</label>
                    <input type="text" id="edit-image" placeholder="https://images.unsplash.com/...">
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveArticle()">💾 Save & Publish</button>
            </div>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast"></div>

    <script>
        let currentArticles = [];

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.innerText = msg;
            toast.style.background = isError ? '#ef4444' : '#10b981';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3200);
        }

        async function loadArticles() {
            const searchInput = document.getElementById('search-input');
            const statusFilter = document.getElementById('status-filter');
            const catFilter = document.getElementById('category-filter');

            const search = searchInput ? searchInput.value : '';
            const status = statusFilter ? statusFilter.value : '';
            const cat = catFilter ? catFilter.value : '';

            let url = `/api/articles?limit=100`;
            if (status) url += `&status=${encodeURIComponent(status)}`;
            if (cat) url += `&category=${encodeURIComponent(cat)}`;
            if (search) url += `&search=${encodeURIComponent(search)}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                currentArticles = data.data || [];

                // Stats
                const totalEl = document.getElementById('stat-total');
                const pubEl = document.getElementById('stat-published');
                const draftEl = document.getElementById('stat-drafts');
                if (totalEl) totalEl.innerText = data.total || 0;
                
                let pubCount = currentArticles.filter(a => a.status === 'published').length;
                if (pubEl) pubEl.innerText = pubCount;
                if (draftEl) draftEl.innerText = (data.total || 0) - pubCount;

                // Render Table
                const tbody = document.getElementById('articles-tbody');
                if (!tbody) return;

                if (currentArticles.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:40px; color:var(--text-muted);">No articles found. Click "Write New Article" to create one!</td></tr>`;
                    return;
                }

                tbody.innerHTML = currentArticles.map(art => `
                    <tr>
                        <td>
                            <strong><a href="/article/${art.slug}" target="_blank" style="color:var(--text-primary); text-decoration:none;">${escapeHtml(art.title)}</a></strong><br>
                            <span style="font-size:0.75rem; color:var(--text-muted); font-family:monospace;">/article/${escapeHtml(art.slug)}</span>
                        </td>
                        <td><span class="badge" style="background:#1e293b; color:#cbd5e1;">${escapeHtml(art.category || 'General')}</span></td>
                        <td>
                            <span class="badge ${art.status === 'published' ? 'badge-published' : 'badge-draft'}">${escapeHtml(art.status || 'published')}</span>
                        </td>
                        <td>${escapeHtml(art.author || 'Editorial')}</td>
                        <td>${art.published_at ? art.published_at.slice(0, 10) : '-'}</td>
                        <td style="white-space:nowrap;">
                            <a href="/article/${art.slug}" target="_blank" class="btn btn-secondary" style="padding:4px 9px; font-size:0.75rem;">👁️ View</a>
                            <button class="btn btn-secondary" style="padding:4px 9px; font-size:0.75rem;" onclick="openEditModal('${art.id}')">✏️ Edit</button>
                            <button class="btn btn-danger" style="padding:4px 9px; font-size:0.75rem;" onclick="deleteArticle('${art.id}')">🗑️</button>
                        </td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error("Failed to load articles:", err);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function openCreateModal() {
            document.getElementById('edit-id').value = '';
            document.getElementById('modal-title').innerText = 'Write New Article';
            document.getElementById('edit-title').value = '';
            document.getElementById('edit-slug').value = '';
            document.getElementById('edit-category').value = 'Technology';
            document.getElementById('edit-status').value = 'published';
            document.getElementById('edit-author').value = 'DigitalBrief Editorial Desk';
            document.getElementById('edit-excerpt').value = '';
            document.getElementById('edit-content').value = '<p>Write your in-depth editorial coverage here...</p>';
            document.getElementById('edit-seo-title').value = '';
            document.getElementById('edit-focus-kw').value = '';
            document.getElementById('edit-meta-desc').value = '';
            document.getElementById('edit-image').value = '';

            document.getElementById('article-modal').classList.add('active');
        }

        function openEditModal(id) {
            const art = currentArticles.find(a => String(a.id) === String(id));
            if (!art) return;

            document.getElementById('edit-id').value = art.id;
            document.getElementById('modal-title').innerText = 'Edit Article';
            document.getElementById('edit-title').value = art.title || '';
            document.getElementById('edit-slug').value = art.slug || '';
            document.getElementById('edit-category').value = art.category || 'Technology';
            document.getElementById('edit-status').value = art.status || 'published';
            document.getElementById('edit-author').value = art.author || 'DigitalBrief Editorial Desk';
            document.getElementById('edit-excerpt').value = art.excerpt || '';
            document.getElementById('edit-content').value = art.content || '';
            document.getElementById('edit-seo-title').value = art.seo_title || '';
            document.getElementById('edit-focus-kw').value = art.focus_keyword || '';
            document.getElementById('edit-meta-desc').value = art.meta_description || '';
            document.getElementById('edit-image').value = art.featured_image || '';

            document.getElementById('article-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('article-modal').classList.remove('active');
        }

        async function saveArticle() {
            const id = document.getElementById('edit-id').value;
            const payload = {
                title: document.getElementById('edit-title').value.trim(),
                slug: document.getElementById('edit-slug').value.trim(),
                category: document.getElementById('edit-category').value,
                status: document.getElementById('edit-status').value,
                author: document.getElementById('edit-author').value.trim(),
                excerpt: document.getElementById('edit-excerpt').value.trim(),
                content: document.getElementById('edit-content').value,
                seo_title: document.getElementById('edit-seo-title').value.trim(),
                focus_keyword: document.getElementById('edit-focus-kw').value.trim(),
                meta_description: document.getElementById('edit-meta-desc').value.trim(),
                featured_image: document.getElementById('edit-image').value.trim(),
            };

            if (!payload.title) {
                alert("Article Title is required!");
                return;
            }

            try {
                let res;
                if (id) {
                    res = await fetch(`/api/articles/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } else {
                    res = await fetch(`/api/articles`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }

                if (res.ok) {
                    closeModal();
                    showToast(id ? "Article updated successfully!" : "Article published successfully!");
                    loadArticles();
                } else {
                    const err = await res.json();
                    alert(err.detail || "Failed to save article");
                }
            } catch (err) {
                console.error("Save error:", err);
                alert("Error saving article");
            }
        }

        async function deleteArticle(id) {
            if (!confirm("Are you sure you want to delete this article? This action cannot be undone.")) return;

            try {
                const res = await fetch(`/api/articles/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast("Article deleted successfully");
                    loadArticles();
                } else {
                    alert("Failed to delete article");
                }
            } catch (err) {
                console.error("Delete error:", err);
                alert("Error deleting article");
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadArticles();
        });
    </script>
</body>
</html>
